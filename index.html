<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Millions – Finanzas</title>
  <meta name="theme-color" content="#7c6af7"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Millions"/>
  <!-- Sin esto, iOS usa una captura de la página como ícono al instalar -->
  <link rel="apple-touch-icon" href="/icon.png"/>
  <link rel="icon" type="image/png" href="/icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{background:#0a0a0f;color:#e8e6ff;font-family:-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
    ::-webkit-scrollbar{width:0}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f8717155}50%{box-shadow:0 0 0 12px #f8717100}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .fadeUp{animation:fadeUp 0.22s ease}
    .msg{animation:fadeIn 0.2s ease}
    select,input,button,textarea{-webkit-appearance:none;font-family:inherit}
  </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
