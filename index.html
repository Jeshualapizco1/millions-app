const daysUntil=day=>{
  if(!day)return null;
  const now=new Date();
  const t=new Date(now.getFullYear(),now.getMonth(),day);
  if(t<=now)t.setMonth(t.getMonth()+1);
  return Math.ceil((t-now)/(864e5));
};

// ── Charts ────────────────────────────────────────────────────────────────────
function DonutChart({data}){
  const ref=useRef(null);const ch=useRef(null);
  useEffect(()=>{
    if(!ref.current||!data.length)return;
    ch.current?.destroy();
    ch.current=new Chart(ref.current,{type:"doughnut",data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.value),backgroundColor:data.map(d=>d.color),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:"72%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${fmt(ctx.raw)}`}}}}});
    return()=>ch.current?.destroy();
  },[data]);
  if(!data.length)return <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:24}}>Sin gastos aún</div>;
  return <canvas ref={ref} style={{maxHeight:160}}/>;
}

function MonthlyChart({data}){
  const ref=useRef(null);const ch=useRef(null);
  useEffect(()=>{
    if(!ref.current||!data.length)return;
    ch.current?.destroy();
    ch.current=new Chart(ref.current,{
      type:"bar",
      data:{
        labels:data.map(d=>d.label),
        datasets:[
          {label:"Ingresos",data:data.map(d=>d.ingresos),backgroundColor:"#4ade8044",borderColor:"#4ade80",borderWidth:2,borderRadius:6,order:2},
          {label:"Gastos",  data:data.map(d=>d.gastos),  backgroundColor:"#f8717144",borderColor:"#f87171",borderWidth:2,borderRadius:6,order:2},
          {type:"line",label:"Balance",data:data.map(d=>d.ingresos-d.gastos),borderColor:"#a89ff9",backgroundColor:"#a89ff922",borderWidth:2,pointRadius:4,pointBackgroundColor:"#a89ff9",fill:false,order:1,tension:0.3},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{labels:{color:C.aLight,font:{size:11},boxWidth:10}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw)}`}}},scales:{x:{ticks:{color:C.muted,font:{size:11}},grid:{color:"#ffffff08"}},y:{ticks:{color:C.muted,callback:v=>fmtShort(v)},grid:{color:"#ffffff08"}}}}
    });
    return()=>ch.current?.destroy();
  },[data]);
  return <canvas ref={ref} style={{maxHeight:200}}/>;
}

function CreditCard({credit,onEdit}){
  const type=CREDIT_TYPES[credit.type]||CREDIT_TYPES.otro;
  const debt=Number(credit.total_debt)||0;const limit=Number(credit.credit_limit)||0;
  const util=limit>0?Math.round((debt/limit)*100):0;
  const utilColor=util<30?C.green:util<70?C.amber:C.red;
  const daysCorte=daysUntil(credit.cut_day);const daysPago=daysUntil(credit.payment_day);
  const nextDate=credit.next_payment_date?new Date(credit.next_payment_date):null;
  const daysNext=nextDate?Math.ceil((nextDate-new Date())/864e5):null;
  const uc=d=>d===null?C.muted:d<=3?C.red:d<=7?C.amber:C.green;
  return(
    <div onClick={()=>onEdit(credit)} style={{background:C.card,border:`1px solid ${C.border}22`,borderRadius:20,padding:18,marginBottom:12,cursor:"pointer",borderLeft:`4px solid ${type.color}`}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:40,height:40,borderRadius:12,background:type.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{type.icon}</div>
          <div><div style={{fontWeight:700,fontSize:15}}>{credit.name}</div><div style={{fontSize:11,color:C.muted}}>{credit.institution||type.label}</div></div>
        </div>
        <div style={{textAlign:"right"}}><div style={{fontSize:18,fontWeight:800,color:C.red}}>{fmt(debt)}</div><div style={{fontSize:11,color:C.muted}}>deuda</div></div>
      </div>
      {credit.type==="tarjeta"&&limit>0&&(
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:11,color:C.muted}}>Utilización</span><span style={{fontSize:11,fontWeight:700,color:utilColor}}>{util}% de {fmt(limit)}</span></div>
          <div style={{height:6,borderRadius:3,background:C.border,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.min(util,100)}%`,background:utilColor,borderRadius:3}}/></div>
        </div>
      )}
      {(credit.type==="hipoteca"||credit.type==="auto"||credit.type==="personal")&&Number(credit.monthly_payment)>0&&(
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <div style={{flex:1,background:C.surface,borderRadius:10,padding:"8px 12px",textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>Mensualidad</div><div style={{fontSize:14,fontWeight:700,color:C.aLight}}>{fmt(credit.monthly_payment)}</div></div>
          {credit.interest_rate&&<div style={{flex:1,background:C.surface,borderRadius:10,padding:"8px 12px",textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>Tasa</div><div style={{fontSize:14,fontWeight:700,color:C.amber}}>{credit.interest_rate}%</div></div>}
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        {credit.type==="tarjeta"&&credit.cut_day&&<div style={{flex:1,background:C.surface,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:10,color:C.muted}}>Corte día {credit.cut_day}</div><div style={{fontSize:13,fontWeight:700,color:uc(daysCorte)}}>{daysCorte===0?"¡Hoy!":daysCorte===1?"Mañana":`${daysCorte}d`}</div></div>}
        {credit.type==="tarjeta"&&credit.payment_day&&<div style={{flex:1,background:C.surface,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:10,color:C.muted}}>Pago día {credit.payment_day}</div><div style={{fontSize:13,fontWeight:700,color:uc(daysPago)}}>{daysPago===0?"¡Hoy!":daysPago===1?"Mañana":`${daysPago}d`}</div></div>}
        {credit.type!=="tarjeta"&&credit.next_payment_date&&<div style={{flex:1,background:C.surface,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:10,color:C.muted}}>Próximo pago</div><div style={{fontSize:12,fontWeight:700,color:uc(daysNext)}}>{daysNext<=0?"¡Vencido!":daysNext===1?"Mañana":`${daysNext}d`}</div></div>}
      </div>
    </div>
  );
}

      <div style={{display:"flex",gap:10,marginTop:4}}>
        {initial&&onDelete&&<button onClick={()=>onDelete(initial.id)} style={{background:C.red+"22",color:C.red,border:`1px solid ${C.red}44`,borderRadius:12,padding:"12px 16px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Eliminar</button>}

      </div>

  );
}

// ── Auth Screen ───────────────────────────────────────────────────────────────
function AuthScreen({onAuth}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");const [password,setPassword]=useState("");const [name,setName]=useState("");
  const [loading,setLoading]=useState(false);const [error,setError]=useState("");const [success,setSuccess]=useState("");
  const inp={width:"100%",background:"#12121a",border:"1px solid #2a2a3e",borderRadius:12,color:"#e8e6ff",padding:"13px 16px",fontSize:15,outline:"none",boxSizing:"border-box",marginBottom:12};
  const submit=async()=>{
    if(!email||!password){setError("Completa todos los campos");return;}
    setLoading(true);setError("");setSuccess("");
    try{
      if(mode==="login"){const{data,error:err}=await sbClient.auth.signInWithPassword({email,password});if(err)throw err;onAuth(data.session);}
      else{const{data,error:err}=await sbClient.auth.signUp({email,password,options:{data:{name}}});if(err)throw err;if(data.session)onAuth(data.session);else setSuccess("¡Cuenta creada! Revisa tu correo y luego inicia sesión.");}
    }catch(e){setError(e.message==="Invalid login credentials"?"Correo o contraseña incorrectos":e.message);}
    finally{setLoading(false)}
  };
  return(
    <div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#0a0a0f",padding:24}}>
      <div style={{marginBottom:32,textAlign:"center"}}>
        <div style={{fontSize:56,marginBottom:10}}>💰</div>
        <div style={{fontSize:26,fontWeight:900,color:"#a89ff9",letterSpacing:-0.5}}>Millions</div>
        <div style={{fontSize:13,color:"#6b6a8a",marginTop:4}}>Finanzas personales</div>
      </div>
      <div style={{width:"100%",maxWidth:380,background:"#1a1a26",border:"1px solid #2a2a3e",borderRadius:24,padding:28}}>
        <div style={{display:"flex",gap:0,marginBottom:24,background:"#12121a",borderRadius:12,padding:4}}>
          {["login","signup"].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setError("");setSuccess("");}} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:mode===m?"#7c6af7":"transparent",color:mode===m?"#fff":"#6b6a8a",fontWeight:700,fontSize:14,cursor:"pointer"}}>{m==="login"?"Iniciar sesión":"Crear cuenta"}</button>
          ))}
        </div>
        {mode==="signup"&&<><label style={{fontSize:12,color:"#6b6a8a",marginBottom:5,display:"block"}}>Nombre</label><input style={inp} placeholder="Tu nombre" value={name} onChange={e=>setName(e.target.value)}/></>}
        <label style={{fontSize:12,color:"#6b6a8a",marginBottom:5,display:"block"}}>Correo</label>
        <input style={inp} type="email" inputMode="email" placeholder="tu@correo.com" value={email} onChange={e=>setEmail(e.target.value)} autoFocus/>
        <label style={{fontSize:12,color:"#6b6a8a",marginBottom:5,display:"block"}}>Contraseña</label>
        <input style={{...inp,marginBottom:20}} type="password" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
        {error&&<div style={{background:"#f8717118",border:"1px solid #f8717144",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#f87171",marginBottom:14}}>{error}</div>}
        {success&&<div style={{background:"#4ade8018",border:"1px solid #4ade8044",borderRadius:10,padding:"10px 14px",fontSize:13,color:"#4ade80",marginBottom:14}}>{success}</div>}
        <button onClick={submit} disabled={loading} style={{width:"100%",background:"linear-gradient(135deg,#7c6af7,#9333ea)",color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:800,cursor:loading?"not-allowed":"pointer",opacity:loading?0.7:1}}>
          {loading?"...":(mode==="login"?"Entrar":"Crear cuenta")}
        </button>
      </div>
    </div>
  );
}

function App({session,onSignOut}){
  const token=session?.access_token;
  const userName=session?.user?.user_metadata?.name||session?.user?.email?.split("@")[0]||"Usuario";

  const [accs,setAccs]=useState([]);
  const [txs,setTxs]=useState([]);
  const [credits,setCredits]=useState([]);
  const [budgets,setBudgets]=useState([]);
  const [goals,setGoals]=useState([]);
  const [tab,setTab]=useState("dash");
  const [booting,setBooting]=useState(true);

  // FAB
  const [fab,setFab]=useState(false);
  const [mic,setMic]=useState(false);
  const [live,setLive]=useState("");
  const [txInput,setTxInput]=useState("");
  const [txLoading,setTxLoading]=useState(false);
  const [txHistory,setTxHistory]=useState([]);

  // Modals
  const [mMan,setMMan]=useState(false);
  const [man,setMan]=useState({desc:"",amt:"",type:"gasto",aid:"",cat:"Otros"});
  const [editAcc,setEditAcc]=useState(null);
  const [mNewAcc,setMNewAcc]=useState(false);
  const [nName,setNName]=useState("");const [nBal,setNBal]=useState("");const [nIcon,setNIcon]=useState("🏦");
  const [mCredit,setMCredit]=useState(false);
  const [editCredit,setEditCredit]=useState(null);
  const [mBudget,setMBudget]=useState(false);
  const [budgetCat,setBudgetCat]=useState("Alimentación");
  const [budgetAmt,setBudgetAmt]=useState("");
  const [mGoal,setMGoal]=useState(false);
  const [editGoal,setEditGoal]=useState(null);
  const [goalForm,setGoalForm]=useState({name:"",target_amount:"",current_amount:"",target_date:"",icon:"🎯",color:"#7c6af7",notes:""});
  const [mAddToGoal,setMAddToGoal]=useState(null);
  const [addGoalAmt,setAddGoalAmt]=useState("");

  // AI
  const [aiMsgs,setAiMsgs]=useState([{role:"assistant",text:"¡Hola! Soy tu asesor financiero 🤖\n\nAnalizo tus cuentas, gastos, ingresos, créditos, presupuestos y metas.\n\nEjemplos:\n• ¿Cómo voy con mis presupuestos?\n• ¿Cuándo llegaré a mi meta de ahorro?\n• Dame un análisis completo\n• ¿En qué gasto más?"}]);
  const [aiInput,setAiInput]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiHistory,setAiHistory]=useState([]);

  const endRef=useRef(null);
  const recRef=useRef(null);
  const accsRef=useRef(accs);const txsRef=useRef(txs);const creditsRef=useRef(credits);
  const budgetsRef=useRef(budgets);const goalsRef=useRef(goals);
  useEffect(()=>{accsRef.current=accs},[accs]);
  useEffect(()=>{txsRef.current=txs},[txs]);
  useEffect(()=>{creditsRef.current=credits},[credits]);
  useEffect(()=>{budgetsRef.current=budgets},[budgets]);
  useEffect(()=>{goalsRef.current=goals},[goals]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[aiMsgs]);

  useEffect(()=>{
    Promise.all([api("getAccounts",undefined,token),api("getTxs",undefined,token),api("getCredits",undefined,token),api("getBudgets",undefined,token),api("getGoals",undefined,token)])
      .then(([a,t,cr,b,g])=>{
        setAccs(a||[]);
        setTxs((t||[]).map(tx=>({...tx,accountId:tx.account_id})));
        setCredits(cr||[]);setBudgets(b||[]);setGoals(g||[]);
      }).catch(console.error).finally(()=>setBooting(false));
  },[token]);

  // Mic cleanup
  const stopMic=useCallback(()=>{if(recRef.current){recRef.current.abort();recRef.current=null;}setMic(false);setLive("");},[]);
  useEffect(()=>{const f=()=>{if(document.hidden)stopMic();};document.addEventListener("visibilitychange",f);return()=>document.removeEventListener("visibilitychange",f);},[stopMic]);
  useEffect(()=>{if(!fab)stopMic();},[fab]);

  const voiceOK=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const startMic=useCallback(()=>{
    if(!voiceOK||mic)return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();
    rec.lang="es-MX";rec.interimResults=true;rec.continuous=false;
    rec.onstart=()=>setMic(true);
    rec.onend=()=>{setMic(false);recRef.current=null};
    rec.onerror=()=>{setMic(false);recRef.current=null};
    rec.onresult=e=>{
      let interim="",final="";
      for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}
      setLive(final||interim);setTxInput(final||interim);
      if(final){setFab(false);setTimeout(()=>sendTx(final.trim()),200);}
    };
    rec.start();recRef.current=rec;
  },[voiceOK,mic]);

  // ── Transactions ───────────────────────────────────────────────────────────
  const applyTx=async tx=>{
    const cur=accsRef.current;
    const acc=cur.find(a=>tx.accountName&&a.name.toLowerCase().includes(tx.accountName.toLowerCase()));
    const tmpId="tmp-"+Date.now();
    setTxs(p=>[{id:tmpId,description:tx.description,amount:tx.amount,type:tx.type,category:tx.category||"Otros",accountId:acc?.id??null,accountName:acc?.name??tx.accountName??"Sin cuenta",date:new Date().toISOString()},...p]);
    if(acc)setAccs(p=>p.map(a=>a.id===acc.id?{...a,balance:Number(a.balance)+(tx.type==="gasto"?-tx.amount:tx.amount)}:a));
    try{
      const [saved]=await api("addTx",{description:tx.description,amount:tx.amount,type:tx.type,category:tx.category||"Otros",account_id:acc?.id??null,account_name:acc?.name??tx.accountName??"Sin cuenta",date:new Date().toISOString()},token);
      if(saved)setTxs(p=>p.map(t=>t.id===tmpId?{...saved,accountId:saved.account_id}:t));
      if(acc)await api("updateBalance",{id:acc.id,delta:tx.type==="gasto"?-tx.amount:tx.amount},token);
    }catch(e){console.error(e)}
  };

  const deleteTx=async id=>{
    const tx=txsRef.current.find(t=>t.id===id);if(!tx)return;
    const delta=tx.type==="gasto"?tx.amount:-tx.amount;
    if(tx.accountId)setAccs(p=>p.map(a=>a.id===tx.accountId?{...a,balance:Number(a.balance)+delta}:a));
    setTxs(p=>p.filter(t=>t.id!==id));
    try{
      await api("deleteTx",{id},token);
      if(tx.accountId)await api("updateBalance",{id:tx.accountId,delta},token);
    }catch(e){console.error(e)}
  };

  const sendTx=async text=>{
    if(!text||txLoading)return;
    setTxInput("");setLive("");setTxLoading(true);
    const cur=accsRef.current;
    const list=cur.map(a=>`${a.name}: ${fmt(a.balance)}`).join(", ");
    const newHist=[...txHistory,{role:"user",content:text}];setTxHistory(newHist);
    const sys=`Asistente de registro financiero de Millions. Cuentas: ${list||"ninguna"}. Categorías: ${Object.keys(CATS).join(", ")}.
Responde SOLO con JSON:
Transacción: {"action":"transaccion","type":"gasto|ingreso","amount":NUMBER,"description":"STRING","accountName":"STRING","category":"STRING","reply":"Confirmación"}
Nueva cuenta: {"action":"nueva_cuenta","accountName":"STRING","balance":NUMBER,"icon":"EMOJI","reply":"Confirmación"}
Duda: {"action":"ninguna","reply":"Aclaración"}`;
    try{
      const data=await api("chat",{model:"claude-sonnet-4-20250514",max_tokens:400,system:sys,messages:newHist},token);
      const raw=data.content?.find(b=>b.type==="text")?.text??"";
      let p;try{p=JSON.parse(raw.replace(/```json|```/g,"").trim())}catch{p={action:"ninguna",reply:raw}}
      if(p.action==="transaccion"&&p.amount>0)await applyTx(p);
      else if(p.action==="nueva_cuenta"&&p.accountName)await applyNewAcc({accountName:p.accountName,balance:p.balance,icon:p.icon});
      setTxHistory([...newHist,{role:"assistant",content:p.reply}]);
      setLive("✅ "+p.reply);setTimeout(()=>setLive(""),3500);
    }catch(e){setLive("❌ Error");setTimeout(()=>setLive(""),3000);}
    finally{setTxLoading(false)}
  };

  // ── Accounts ───────────────────────────────────────────────────────────────
  const applyNewAcc=async d=>{
    const cur=accsRef.current;const color=ACC_COLORS[cur.length%ACC_COLORS.length];const tmpId="tmp-"+Date.now();
    setAccs(p=>[...p,{id:tmpId,name:d.accountName,balance:d.balance??0,color,icon:d.icon??"🏦"}]);
    try{const [s]=await api("addAccount",{name:d.accountName,balance:d.balance??0,color,icon:d.icon??"🏦"},token);if(s)setAccs(p=>p.map(a=>a.id===tmpId?s:a));}catch(e){console.error(e)}
  };
  const saveNewAcc=async()=>{if(!nName.trim())return;await applyNewAcc({accountName:nName.trim(),balance:parseFloat(nBal||0),icon:nIcon});setNName("");setNBal("");setNIcon("🏦");setMNewAcc(false);};
  const saveEditAcc=async()=>{
    if(!editAcc||!editAcc.name.trim())return;
    setAccs(p=>p.map(a=>a.id===editAcc.id?{...a,...editAcc}:a));
    try{await api("updateAccount",{id:editAcc.id,name:editAcc.name,balance:parseFloat(editAcc.balance),icon:editAcc.icon,color:editAcc.color},token);}catch(e){console.error(e)}
    setEditAcc(null);
  };

  // ── Credits ────────────────────────────────────────────────────────────────
  const parseCredit=f=>({name:f.name,type:f.type,institution:f.institution||null,total_debt:parseFloat(f.total_debt||0),credit_limit:parseFloat(f.credit_limit||0)||null,monthly_payment:parseFloat(f.monthly_payment||0)||null,cut_day:parseInt(f.cut_day)||null,payment_day:parseInt(f.payment_day)||null,next_payment_date:f.next_payment_date||null,interest_rate:parseFloat(f.interest_rate)||null,notes:f.notes||null});
  const saveNewCredit=async f=>{if(!f.name.trim())return;const p=parseCredit(f);const tmpId="tmp-"+Date.now();setCredits(pr=>[...pr,{id:tmpId,...p}]);setMCredit(false);try{const[s]=await api("addCredit",p,token);if(s)setCredits(pr=>pr.map(c=>c.id===tmpId?s:c));}catch(e){console.error(e)}};
  const saveEditCredit=async f=>{if(!f.name.trim())return;const p={id:f.id,...parseCredit(f)};setCredits(pr=>pr.map(c=>c.id===f.id?{...c,...p}:c));setEditCredit(null);try{await api("updateCredit",p,token);}catch(e){console.error(e)}};
  const deleteCredit=async id=>{setCredits(p=>p.filter(c=>c.id!==id));setEditCredit(null);try{await api("deleteCredit",{id},token);}catch(e){console.error(e)}};

  // ── Budgets ────────────────────────────────────────────────────────────────
  const saveBudget=async()=>{
    if(!budgetAmt)return;
    const existing=budgetsRef.current.find(b=>b.category===budgetCat);
    if(existing)setBudgets(p=>p.map(b=>b.category===budgetCat?{...b,amount:parseFloat(budgetAmt)}:b));
    else setBudgets(p=>[...p,{id:"tmp-"+Date.now(),category:budgetCat,amount:parseFloat(budgetAmt)}]);
    try{await api("upsertBudget",{category:budgetCat,amount:parseFloat(budgetAmt)},token);}catch(e){console.error(e)}
    setBudgetAmt("");setMBudget(false);
  };
  const deleteBudget=async id=>{setBudgets(p=>p.filter(b=>b.id!==id));try{await api("deleteBudget",{id},token);}catch(e){console.error(e)}};

  // ── Goals ──────────────────────────────────────────────────────────────────
  const saveNewGoal=async()=>{
    if(!goalForm.name||!goalForm.target_amount)return;
    const p={name:goalForm.name,target_amount:parseFloat(goalForm.target_amount),current_amount:parseFloat(goalForm.current_amount||0),target_date:goalForm.target_date||null,icon:goalForm.icon,color:goalForm.color,notes:goalForm.notes||null};
    const tmpId="tmp-"+Date.now();setGoals(pr=>[...pr,{id:tmpId,...p}]);setMGoal(false);
    try{const[s]=await api("addGoal",p,token);if(s)setGoals(pr=>pr.map(g=>g.id===tmpId?s:g));}catch(e){console.error(e)}
  };
  const saveEditGoal=async()=>{
    if(!editGoal)return;
    const p={id:editGoal.id,name:editGoal.name,target_amount:parseFloat(editGoal.target_amount),current_amount:parseFloat(editGoal.current_amount||0),target_date:editGoal.target_date||null,icon:editGoal.icon,color:editGoal.color,notes:editGoal.notes||null};
    setGoals(pr=>pr.map(g=>g.id===editGoal.id?{...g,...p}:g));setEditGoal(null);
    try{await api("updateGoal",p,token);}catch(e){console.error(e)}
  };
  const deleteGoal=async id=>{setGoals(p=>p.filter(g=>g.id!==id));setEditGoal(null);try{await api("deleteGoal",{id},token);}catch(e){console.error(e)}};
  const addToGoal=async()=>{
    if(!mAddToGoal||!addGoalAmt)return;
    const newAmt=Number(mAddToGoal.current_amount)+parseFloat(addGoalAmt);
    setGoals(p=>p.map(g=>g.id===mAddToGoal.id?{...g,current_amount:newAmt}:g));
    setMAddToGoal(null);setAddGoalAmt("");
    try{await api("updateGoal",{id:mAddToGoal.id,current_amount:newAmt},token);}catch(e){console.error(e)}
  };

  // ── AI Analysis ────────────────────────────────────────────────────────────
  const sendAnalysis=async text=>{
    if(!text||aiLoading)return;
    setAiInput("");
    const cur=accsRef.current;const curTxs=txsRef.current;const curCr=creditsRef.current;
    const curB=budgetsRef.current;const curG=goalsRef.current;
    const newHist=[...aiHistory,{role:"user",content:text}];
    setAiMsgs(m=>[...m,{role:"user",text}]);setAiLoading(true);
    const totG=curTxs.filter(t=>t.type==="gasto").reduce((s,t)=>s+Number(t.amount),0);
    const totI=curTxs.filter(t=>t.type==="ingreso").reduce((s,t)=>s+Number(t.amount),0);
    const catMap={};curTxs.filter(t=>t.type==="gasto").forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+Number(t.amount);});

    // This month spending
    const now=new Date();
    const thisMonthTxs=curTxs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const thisMonthSpend={};thisMonthTxs.filter(t=>t.type==="gasto").forEach(t=>{thisMonthSpend[t.category]=(thisMonthSpend[t.category]||0)+Number(t.amount);});

    const budgetStatus=curB.map(b=>{const spent=thisMonthSpend[b.category]||0;const pct=Math.round((spent/b.amount)*100);return `${b.category}: presupuesto ${fmt(b.amount)}, gastado ${fmt(spent)} (${pct}%)`;}).join("\n");
    const goalStatus=curG.map(g=>{const pct=g.target_amount>0?Math.round((g.current_amount/g.target_amount)*100):0;return `${g.name}: meta ${fmt(g.target_amount)}, ahorrado ${fmt(g.current_amount)} (${pct}%)${g.target_date?`, fecha objetivo: ${new Date(g.target_date).toLocaleDateString("es-MX")}`:""}`;}).join("\n");
    const sys=`Eres el asesor financiero de Millions. Responde en español, amigable, claro y accionable. Máximo 3 párrafos, emojis moderados.

DATOS:
Cuentas: ${cur.map(a=>`${a.name}: ${fmt(a.balance)}`).join(", ")||"Sin cuentas"}
Ingresos totales: ${fmt(totI)} | Gastos totales: ${fmt(totG)} | Balance: ${fmt(totI-totG)}
Top gastos: ${Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${k}: ${fmt(v)}`).join(", ")||"Sin datos"}
Deuda total: ${fmt(curCr.reduce((s,c)=>s+Number(c.total_debt||0),0))}
Créditos: ${curCr.map(c=>`${c.name}: ${fmt(c.total_debt)}`).join(", ")||"Ninguno"}
Presupuestos este mes:\n${budgetStatus||"Sin presupuestos"}
Metas de ahorro:\n${goalStatus||"Sin metas"}
Últimas txs: ${curTxs.slice(0,15).map(t=>`${t.type==="gasto"?"-":"+"}${fmt(t.amount)} ${t.description}`).join(", ")||"Sin transacciones"}`;
    try{
      const data=await api("chat",{model:"claude-sonnet-4-20250514",max_tokens:700,system:sys,messages:newHist},token);
      const reply=data.content?.find(b=>b.type==="text")?.text??"Error.";
      setAiHistory([...newHist,{role:"assistant",content:reply}]);
      setAiMsgs(m=>[...m,{role:"assistant",text:reply}]);
    }catch(e){setAiMsgs(m=>[...m,{role:"assistant",text:"Error al conectar."}]);}
    finally{setAiLoading(false)}
  };

  const saveTxManual=async()=>{
    const{desc,amt,type,aid,cat}=man;if(!desc||!amt||!aid)return;
    await applyTx({description:desc,amount:parseFloat(amt),type,category:cat,accountName:accs.find(a=>a.id===aid)?.name??""});
    setMan({desc:"",amt:"",type:"gasto",aid:"",cat:"Otros"});setMMan(false);
  };

  // ── Derived data ───────────────────────────────────────────────────────────
  const totBal=accs.reduce((s,a)=>s+Number(a.balance),0);
  const totG=txs.filter(t=>t.type==="gasto").reduce((s,t)=>s+Number(t.amount),0);
  const totI=txs.filter(t=>t.type==="ingreso").reduce((s,t)=>s+Number(t.amount),0);
  const totalDebt=credits.reduce((s,c)=>s+Number(c.total_debt||0),0);

  const urgentCredits=useMemo(()=>credits.filter(c=>{const d1=daysUntil(c.payment_day);const d2=c.next_payment_date?Math.ceil((new Date(c.next_payment_date)-new Date())/864e5):null;return(d1!==null&&d1<=5)||(d2!==null&&d2<=5);}),[credits]);

  const catData=useMemo(()=>{
    const map={};txs.filter(t=>t.type==="gasto").forEach(t=>{const c=t.category||"Otros";map[c]=(map[c]||0)+Number(t.amount);});
    return Object.entries(map).map(([label,value])=>({label,value,color:CATS[label]?.color||"#6b7280",icon:CATS[label]?.icon||"📦"})).sort((a,b)=>b.value-a.value);
  },[txs]);

  // 6-month data
  const monthlyData=useMemo(()=>{
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
      const y=d.getFullYear();const m=d.getMonth();
      const mt=txs.filter(t=>{const td=new Date(t.date);return td.getFullYear()===y&&td.getMonth()===m;});
      months.push({label:monthLabel(d),ingresos:mt.filter(t=>t.type==="ingreso").reduce((s,t)=>s+Number(t.amount),0),gastos:mt.filter(t=>t.type==="gasto").reduce((s,t)=>s+Number(t.amount),0)});
    }
    return months;
  },[txs]);

  // Month comparison
  const comparison=useMemo(()=>{
    const now=new Date();
    const thisM=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
    const lastD=new Date(now.getFullYear(),now.getMonth()-1,1);
    const lastM=txs.filter(t=>{const d=new Date(t.date);return d.getFullYear()===lastD.getFullYear()&&d.getMonth()===lastD.getMonth();});
    const tG=thisM.filter(t=>t.type==="gasto").reduce((s,t)=>s+Number(t.amount),0);
    const lG=lastM.filter(t=>t.type==="gasto").reduce((s,t)=>s+Number(t.amount),0);
    const tI=thisM.filter(t=>t.type==="ingreso").reduce((s,t)=>s+Number(t.amount),0);
    const lI=lastM.filter(t=>t.type==="ingreso").reduce((s,t)=>s+Number(t.amount),0);
    const diff=lG>0?Math.round(((tG-lG)/lG)*100):null;
    return{thisGastos:tG,lastGastos:lG,thisIngresos:tI,lastIngresos:lI,diffPct:diff};
  },[txs]);

  // Budget progress (this month)
  const budgetProgress=useMemo(()=>{
    const now=new Date();
    const thisMonthGastos={};
    txs.filter(t=>{const d=new Date(t.date);return t.type==="gasto"&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}).forEach(t=>{thisMonthGastos[t.category]=(thisMonthGastos[t.category]||0)+Number(t.amount);});
    return budgets.map(b=>({...b,spent:thisMonthGastos[b.category]||0,pct:Math.round(((thisMonthGastos[b.category]||0)/b.amount)*100)}));
  },[budgets,txs]);

  const s={
    card:{background:C.card,border:`1px solid ${C.border}22`,borderRadius:20,padding:18,marginBottom:14},
    inp:{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,color:C.text,padding:"12px 16px",fontSize:15,outline:"none",boxSizing:"border-box"},
    btn:(bg=C.accent)=>({background:bg,color:"#fff",border:"none",borderRadius:12,padding:"13px 20px",fontSize:14,fontWeight:700,cursor:"pointer"}),
    btnO:{background:"transparent",color:C.aLight,border:`1px solid ${C.accent}44`,borderRadius:12,padding:"13px 20px",fontSize:14,fontWeight:600,cursor:"pointer"},
    lbl:{fontSize:12,color:C.muted,marginBottom:6,display:"block",fontWeight:500},
  };

  if(booting)return(
    <div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.bg,gap:16}}>
      <div style={{fontSize:52}}>💰</div>
      <div style={{width:28,height:28,border:`3px solid ${C.accent}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <div style={{color:C.muted,fontSize:13}}>Cargando tus finanzas…</div>
    </div>
  );

  return(
    <div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",background:C.bg}}>
      {/* Header */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}22`,padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:"calc(env(safe-area-inset-top,0px) + 14px)"}}>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:C.aLight,letterSpacing:-0.5}}>Millions</div>
          <div style={{fontSize:11,color:C.muted,marginTop:1}}>{userName}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{background:`linear-gradient(135deg,${C.accent},#9333ea)`,color:"#fff",borderRadius:12,padding:"6px 14px",fontSize:13,fontWeight:800,boxShadow:"0 4px 12px #7c6af733"}}>{fmt(totBal)}</div>
          <button onClick={onSignOut} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:10,color:C.muted,fontSize:12,padding:"6px 10px",cursor:"pointer"}}>↩</button>
        </div>
      </div>

      {/* Alert banner */}
      {urgentCredits.length>0&&(
        <div style={{background:C.red+"18",borderBottom:`1px solid ${C.red}33`,padding:"10px 20px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>setTab("creditos")}>
          <span style={{fontSize:18}}>🚨</span>

        {/* ── DASHBOARD ── */}

          {/* Saldo total */}
          <div style={{background:"linear-gradient(135deg,#1a1a3e,#0f0f2e)",border:`1px solid ${C.accent}33`,borderRadius:24,padding:"24px 20px",marginBottom:14,textAlign:"center",position:"relative",overflow:"hidden"}}>

            <div style={{fontSize:40,fontWeight:900,color:totBal>=0?C.green:C.red,letterSpacing:-1}}>{fmt(totBal)}</div>
            <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:16,flexWrap:"wrap"}}>
              <div style={{textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>Ingresos</div><div style={{fontSize:14,fontWeight:700,color:C.green}}>{fmt(totI)}</div></div>
              <div style={{width:1,background:C.border}}/>
              <div style={{textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>Gastos</div><div style={{fontSize:14,fontWeight:700,color:C.red}}>{fmt(totG)}</div></div>
              {totalDebt>0&&<><div style={{width:1,background:C.border}}/><div style={{textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>Deudas</div><div style={{fontSize:14,fontWeight:700,color:C.amber}}>{fmt(totalDebt)}</div></div></>}
            </div>
          </div>

          {/* Comparativa mes a mes */}
          {comparison.diffPct!==null&&(
            <div style={{...s.card,display:"flex",gap:10}}>
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Gastos este mes</div>

                <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Mes pasado</div>

              </div>
            </div>
          )}

          {/* Gráfica 6 meses */}
          <div style={s.card}>
            <div style={{fontWeight:700,marginBottom:14,fontSize:14,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Últimos 6 meses</div>

          </div>

          {/* Gastos por categoría */}
          <div style={s.card}>
            <div style={{fontWeight:700,marginBottom:14,fontSize:14,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Gastos por categoría</div>
            <div style={{height:160,marginBottom:14}}><DonutChart data={catData}/></div>
            {catData.map(d=>(
              <div key={d.label} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}22`}}>

                <div style={{display:"flex",gap:12,alignItems:"center"}}><span style={{fontSize:11,color:C.muted}}>{totG>0?Math.round(d.value/totG*100):0}%</span><span style={{fontSize:13,fontWeight:700,color:C.red}}>{fmt(d.value)}</span></div>
              </div>

            {catData.length===0&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:12}}>Sin gastos aún</div>}
          </div>

          {/* Cuentas */}
          <div style={s.card}>
            <div style={{fontWeight:700,marginBottom:12,fontSize:14,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Mis cuentas</div>

              <div key={a.id} onClick={()=>setEditAcc({...a})} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 0",borderBottom:`1px solid ${C.border}22`,cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:36,height:36,borderRadius:10,background:a.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{a.icon}</div>
                  <div><div style={{fontWeight:600,fontSize:14}}>{a.name}</div><div style={{fontSize:11,color:C.muted}}>Toca para editar</div></div>
                </div>
                <div style={{fontWeight:800,color:Number(a.balance)>=0?C.green:C.red,fontSize:15}}>{fmt(a.balance)}</div>
              </div>

          </div>

          {/* Recientes */}
          <div style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{fontWeight:700,fontSize:14,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Recientes</div>
              {txs.length>5&&<button onClick={()=>setTab("hist")} style={{background:"none",border:"none",color:C.aLight,fontSize:12,cursor:"pointer"}}>Ver todo →</button>}
            </div>
            {txs.length===0&&<div style={{color:C.muted,fontSize:13}}>Sin transacciones aún</div>}
            {txs.slice(0,5).map(t=><TxRow key={t.id} tx={t}/>)}
          </div>
        </div>}

        {/* ── METAS (Presupuestos + Ahorro) ── */}
        {tab==="metas"&&<div className="fadeUp">

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>

                <div style={{fontWeight:800,fontSize:16}}>📋 Presupuestos</div>

              </div>
              <button onClick={()=>setMBudget(true)} style={{...s.btn(),padding:"8px 14px",fontSize:13}}>＋ Agregar</button>
            </div>
            {budgetProgress.length===0&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:16}}>Sin presupuestos. Define cuánto puedes gastar por categoría.</div>}

              const pctCapped=Math.min(b.pct,100);
              const barColor=b.pct>=100?C.red:b.pct>=80?C.amber:C.green;

                <div key={b.id} style={{marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,alignItems:"center"}}>

                      <span style={{fontSize:16}}>{CATS[b.category]?.icon||"📦"}</span>

                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:12,color:C.muted}}>{fmt(b.spent)} / {fmt(b.amount)}</span>

                    </div>
                  </div>
                  <div style={{height:8,borderRadius:4,background:C.border,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${pctCapped}%`,background:barColor,borderRadius:4,transition:"width 0.4s ease"}}/>
                  </div>
                  <div style={{fontSize:11,color:barColor,marginTop:3,fontWeight:600}}>
                    {b.pct>=100?`⚠️ Excedido por ${fmt(b.spent-b.amount)}`:b.pct>=80?`⚠️ ${b.pct}% usado — queda ${fmt(b.amount-b.spent)}`:`${b.pct}% usado — queda ${fmt(b.amount-b.spent)}`}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Metas de ahorro */}
          <div style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>🎯 Metas de ahorro</div>
                <div style={{fontSize:12,color:C.muted,marginTop:2}}>Objetivos financieros</div>
              </div>
              <button onClick={()=>{setGoalForm({name:"",target_amount:"",current_amount:"",target_date:"",icon:"🎯",color:"#7c6af7",notes:""});setMGoal(true);}} style={{...s.btn(),padding:"8px 14px",fontSize:13}}>＋ Nueva</button>
            </div>
            {goals.length===0&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:16}}>Sin metas aún. Define tus objetivos financieros.</div>}

              const pct=g.target_amount>0?Math.min(Math.round((g.current_amount/g.target_amount)*100),100):0;
              const barColor=pct>=100?C.green:pct>=60?C.aLight:C.accent;
              const targetDate=g.target_date?new Date(g.target_date):null;
              const daysLeft=targetDate?Math.ceil((targetDate-new Date())/864e5):null;
              // Estimate months to complete
              const remaining=Number(g.target_amount)-Number(g.current_amount);
              return(
                <div key={g.id} style={{background:C.surface,borderRadius:16,padding:16,marginBottom:12,border:`1px solid ${g.color}33`}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:40,height:40,borderRadius:12,background:g.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{g.icon}</div>
                      <div>
                        <div style={{fontWeight:700,fontSize:15}}>{g.name}</div>
                        {targetDate&&<div style={{fontSize:11,color:daysLeft<=30?C.amber:C.muted}}>{daysLeft<=0?"¡Fecha vencida!":daysLeft===1?"Mañana":`${daysLeft} días restantes`}</div>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>setMAddToGoal(g)} style={{background:g.color+"22",border:`1px solid ${g.color}44`,color:g.color,borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>＋ Abonar</button>
                      <button onClick={()=>setEditGoal({...g})} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:15}}>✏️</button>
                    </div>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                    <span style={{fontSize:13,color:C.muted}}>Ahorrado</span>
                    <span style={{fontSize:14,fontWeight:700,color:barColor}}>{fmt(g.current_amount)} <span style={{color:C.muted,fontWeight:400}}>/ {fmt(g.target_amount)}</span></span>
                  </div>
                  <div style={{height:8,borderRadius:4,background:C.border,overflow:"hidden",marginBottom:6}}>
                    <div style={{height:"100%",width:`${pct}%`,background:barColor,borderRadius:4,transition:"width 0.4s ease"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontSize:11,color:barColor,fontWeight:600}}>{pct>=100?"✅ ¡Meta alcanzada!":`${pct}% completado`}</span>
                    {remaining>0&&<span style={{fontSize:11,color:C.muted}}>Faltan {fmt(remaining)}</span>}
                  </div>
                  {g.notes&&<div style={{fontSize:12,color:C.muted,marginTop:8,fontStyle:"italic"}}>{g.notes}</div>}
                </div>
              );
            })}
          </div>
        </div>}

        {/* ── CRÉDITOS ── */}
        {tab==="creditos"&&<div className="fadeUp">
          <div style={{background:"linear-gradient(135deg,#1a0f2e,#0f0820)",border:`1px solid #f472b633`,borderRadius:20,padding:"20px",marginBottom:14,textAlign:"center"}}>
            <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1.5,marginBottom:6}}>Total de deudas</div>
            <div style={{fontSize:34,fontWeight:900,color:C.red,letterSpacing:-1}}>{fmt(totalDebt)}</div>
            {credits.length>0&&<div style={{fontSize:12,color:C.muted,marginTop:6}}>{credits.length} crédito{credits.length!==1?"s":""} registrado{credits.length!==1?"s":""}</div>}
          </div>
          {credits.length>0&&(()=>{
            const byType={};credits.forEach(c=>{if(!byType[c.type])byType[c.type]=0;byType[c.type]+=Number(c.total_debt||0);});
            return <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>{Object.entries(byType).map(([type,debt])=>{const t=CREDIT_TYPES[type]||CREDIT_TYPES.otro;return <div key={type} style={{flex:"1 0 calc(50% - 4px)",background:t.color+"11",border:`1px solid ${t.color}33`,borderRadius:14,padding:"10px 14px"}}><div style={{fontSize:13}}>{t.icon} {t.label}</div><div style={{fontSize:16,fontWeight:800,color:C.red,marginTop:2}}>{fmt(debt)}</div></div>;})}</div>;
          })()}
          {credits.map(c=><CreditCard key={c.id} credit={c} onEdit={setEditCredit}/>)}
          {credits.length===0&&<div style={{...s.card,textAlign:"center",padding:32}}><div style={{fontSize:48,marginBottom:12}}>💳</div><div style={{fontWeight:700,marginBottom:6}}>Sin créditos</div><div style={{fontSize:13,color:C.muted,marginBottom:20}}>Agrega tus tarjetas, hipoteca o crédito automotriz</div></div>}
          <button style={{...s.btn(),width:"100%"}} onClick={()=>setMCredit(true)}>＋ Agregar crédito</button>
        </div>}

        {/* ── ANÁLISIS ── */}
        {tab==="analisis"&&<div className="fadeUp">
          <div style={s.card}>
            <div style={{fontWeight:800,fontSize:17,marginBottom:4}}>🤖 Asesor Financiero</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:14}}>Analizo cuentas, gastos, créditos, presupuestos y metas en tiempo real.</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
              {["¿Cómo voy con mis presupuestos?","¿Cuándo alcanzaré mis metas?","Dame recomendaciones","Analiza mi situación completa","¿En qué gasto más?"].map(q=>(
                <button key={q} onClick={()=>sendAnalysis(q)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:20,padding:"6px 12px",fontSize:12,color:C.aLight,cursor:"pointer"}}>{q}</button>
              ))}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10,minHeight:200,maxHeight:400,overflowY:"auto",marginBottom:14}}>
              {aiMsgs.map((m,i)=>(
                <div key={i} className="msg" style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                  <div style={{maxWidth:"85%",background:m.role==="user"?C.accent:C.surface,border:m.role==="assistant"?`1px solid ${C.border}44`:"none",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",padding:"10px 14px",fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{m.text}</div>
                </div>
              ))}
              {aiLoading&&<div style={{display:"flex",justifyContent:"flex-start"}}><div style={{background:C.surface,border:`1px solid ${C.border}44`,borderRadius:"18px 18px 18px 4px",padding:"10px 14px",fontSize:14,color:C.muted}}>Analizando…</div></div>}
              <div ref={endRef}/>
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input style={{...s.inp,flex:1}} placeholder="Pregunta sobre tus finanzas…" value={aiInput} onChange={e=>setAiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendAnalysis(aiInput.trim())}/>
              <button style={{...s.btn(),padding:"12px 16px"}} onClick={()=>sendAnalysis(aiInput.trim())} disabled={aiLoading||!aiInput.trim()}>↑</button>
            </div>
          </div>
        </div>}

        {/* ── HISTORIAL ── */}
        {tab==="hist"&&<div className="fadeUp">
          <div style={s.card}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:14,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Historial completo</div>
              {txs.length>0&&<button onClick={()=>exportCSV(txs)} style={{...s.btn(),padding:"7px 14px",fontSize:12,background:`${C.accent}22`,color:C.aLight,border:`1px solid ${C.accent}44`}}>📤 Exportar</button>}
            </div>
            {txs.length===0&&<div style={{color:C.muted,fontSize:13}}>Sin transacciones aún</div>}
            {txs.map(t=><TxRow key={t.id} tx={t} onDelete={deleteTx}/>)}
          </div>
        </div>}

        {/* ── CUENTAS ── */}
        {tab==="accs"&&<div className="fadeUp">
          {accs.map(a=>(
            <div key={a.id} onClick={()=>setEditAcc({...a})} style={{...s.card,borderLeft:`4px solid ${a.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:44,height:44,borderRadius:14,background:a.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{a.icon}</div>
                  <div><div style={{fontWeight:700,fontSize:16}}>{a.name}</div><div style={{fontSize:12,color:C.muted}}>{txs.filter(t=>t.accountId===a.id).length} transacciones</div></div>
                </div>
                <div style={{fontWeight:800,fontSize:20,color:Number(a.balance)>=0?C.green:C.red}}>{fmt(a.balance)}</div>
              </div>
            </div>
          ))}

        </div>}
      </div>

      {/* FAB */}
      {!fab&&<button onClick={()=>setFab(true)} style={{position:"fixed",bottom:`calc(env(safe-area-inset-bottom,0px) + 24px)`,right:24,width:60,height:60,borderRadius:"50%",background:`linear-gradient(135deg,${C.accent},#9333ea)`,border:"none",color:"#fff",fontSize:28,cursor:"pointer",boxShadow:"0 8px 24px #7c6af755",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>＋</button>}

      {/* FAB Sheet */}
      {fab&&(
        <div style={{position:"fixed",inset:0,background:"#000b",zIndex:100,display:"flex",flexDirection:"column",justifyContent:"flex-end",animation:"fadeIn 0.15s ease"}} onClick={()=>{stopMic();setFab(false);}}>
          <div style={{background:C.card,borderRadius:"24px 24px 0 0",padding:"20px",paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 20px)",animation:"slideUp 0.2s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{width:36,height:4,background:C.border,borderRadius:2,margin:"0 auto 20px"}}/>
            {mic&&<div style={{background:C.red+"18",border:`1px solid ${C.red}44`,borderRadius:12,padding:"10px 16px",marginBottom:14,fontSize:13,color:C.red,display:"flex",alignItems:"center",gap:8}}><span style={{width:8,height:8,borderRadius:"50%",background:C.red,display:"inline-block",animation:"pulse 1s infinite"}}/>{live||"Escuchando…"}</div>}
            {!mic&&live&&<div style={{background:C.green+"18",border:`1px solid ${C.green}44`,borderRadius:12,padding:"10px 16px",marginBottom:14,fontSize:13,color:C.green}}>{live}</div>}
            {txLoading&&<div style={{textAlign:"center",color:C.muted,fontSize:13,marginBottom:14}}>Procesando…</div>}
            <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
              <button onClick={mic?stopMic:startMic} disabled={!voiceOK||txLoading} style={{width:50,height:50,borderRadius:"50%",flexShrink:0,border:`2px solid ${mic?C.red:C.accent}`,background:mic?C.red+"22":C.accent+"22",color:mic?C.red:C.aLight,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",animation:mic?"pulse 1.2s ease-in-out infinite":"none"}}>
                {mic?"⏹":"🎙️"}

              <button style={{...s.btn(),padding:"12px 14px"}} onClick={()=>sendTx(txInput.trim())} disabled={txLoading||!txInput.trim()}>↑</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}><div style={{flex:1,height:1,background:C.border}}/><span style={{fontSize:12,color:C.muted}}>o</span><div style={{flex:1,height:1,background:C.border}}/></div>
            <button style={{...s.btn(`${C.accent}22`),width:"100%",color:C.aLight,border:`1px solid ${C.accent}44`}} onClick={()=>{setFab(false);setMMan(true);}}>✏️ Entrada manual</button>
          </div>
        </div>
      )}

      {/* Modal: Nueva cuenta */}
      {mNewAcc&&<Modal onClose={()=>setMNewAcc(false)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Nueva cuenta</div>
        <label style={s.lbl}>Nombre</label>
        <input autoFocus style={{...s.inp,marginBottom:14}} placeholder="Ej: BBVA, Revolut…" value={nName} onChange={e=>setNName(e.target.value)}/>
        <label style={s.lbl}>Saldo inicial</label>
        <input style={{...s.inp,marginBottom:14}} type="number" inputMode="decimal" placeholder="0.00" value={nBal} onChange={e=>setNBal(e.target.value)}/>
        <label style={s.lbl}>Ícono</label>
        <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>{ACC_ICONS.map(ic=><button key={ic} onClick={()=>setNIcon(ic)} style={{fontSize:24,background:nIcon===ic?C.accent+"33":"transparent",border:`2px solid ${nIcon===ic?C.accent:C.border+"44"}`,borderRadius:10,padding:"6px 8px",cursor:"pointer"}}>{ic}</button>)}</div>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>setMNewAcc(false)}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={saveNewAcc}>Agregar</button>
        </div>
      </Modal>}

      {/* Modal: Editar cuenta */}
      {editAcc&&<Modal onClose={()=>setEditAcc(null)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Editar cuenta</div>
        <label style={s.lbl}>Nombre</label>
        <input autoFocus style={{...s.inp,marginBottom:14}} value={editAcc.name} onChange={e=>setEditAcc(a=>({...a,name:e.target.value}))}/>
        <label style={s.lbl}>Saldo actual</label>
        <input style={{...s.inp,marginBottom:14}} type="number" inputMode="decimal" value={editAcc.balance} onChange={e=>setEditAcc(a=>({...a,balance:e.target.value}))}/>
        <label style={s.lbl}>Ícono</label>
        <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>{ACC_ICONS.map(ic=><button key={ic} onClick={()=>setEditAcc(a=>({...a,icon:ic}))} style={{fontSize:24,background:editAcc.icon===ic?C.accent+"33":"transparent",border:`2px solid ${editAcc.icon===ic?C.accent:C.border+"44"}`,borderRadius:10,padding:"6px 8px",cursor:"pointer"}}>{ic}</button>)}</div>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>setEditAcc(null)}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={saveEditAcc}>Guardar</button>
        </div>
      </Modal>}

      {/* Modal: Créditos */}
      {mCredit&&<Modal onClose={()=>setMCredit(false)}><CreditForm onSave={saveNewCredit} onClose={()=>setMCredit(false)}/></Modal>}
      {editCredit&&<Modal onClose={()=>setEditCredit(null)}><CreditForm initial={editCredit} onSave={saveEditCredit} onDelete={deleteCredit} onClose={()=>setEditCredit(null)}/></Modal>}

      {/* Modal: Nuevo presupuesto */}
      {mBudget&&<Modal onClose={()=>setMBudget(false)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Nuevo presupuesto</div>
        <label style={s.lbl}>Categoría</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
          {Object.entries(CATS).filter(([k])=>k!=="Ventas"&&k!=="Nómina"&&k!=="Transferencia").map(([k,v])=>(
            <button key={k} onClick={()=>setBudgetCat(k)} style={{padding:"7px 12px",borderRadius:20,border:`2px solid ${budgetCat===k?v.color:C.border+"44"}`,background:budgetCat===k?v.color+"22":"transparent",color:budgetCat===k?v.color:C.muted,fontSize:13,cursor:"pointer",fontWeight:budgetCat===k?700:400}}>{v.icon} {k}</button>
          ))}
        </div>
        <label style={s.lbl}>Límite mensual</label>
        <input autoFocus style={{...s.inp,marginBottom:20}} type="number" inputMode="decimal" placeholder="0.00" value={budgetAmt} onChange={e=>setBudgetAmt(e.target.value)}/>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>setMBudget(false)}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={saveBudget}>Guardar</button>
        </div>
      </Modal>}

      {/* Modal: Nueva meta */}
      {mGoal&&<Modal onClose={()=>setMGoal(false)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Nueva meta de ahorro</div>
        <label style={s.lbl}>Nombre</label>
        <input autoFocus style={{...s.inp,marginBottom:12}} placeholder="Ej: Viaje a Japón, Fondo de emergencia…" value={goalForm.name} onChange={e=>setGoalForm(f=>({...f,name:e.target.value}))}/>
        <label style={s.lbl}>Ícono</label>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>{GOAL_ICONS.map(ic=><button key={ic} onClick={()=>setGoalForm(f=>({...f,icon:ic}))} style={{fontSize:22,background:goalForm.icon===ic?C.accent+"33":"transparent",border:`2px solid ${goalForm.icon===ic?C.accent:C.border+"44"}`,borderRadius:10,padding:"5px 8px",cursor:"pointer"}}>{ic}</button>)}</div>
        <label style={s.lbl}>Color</label>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>{GOAL_COLORS.map(col=><button key={col} onClick={()=>setGoalForm(f=>({...f,color:col}))} style={{width:28,height:28,borderRadius:"50%",background:col,border:`3px solid ${goalForm.color===col?"#fff":col+"44"}`,cursor:"pointer"}}/> )}</div>
        <div style={{display:"flex",gap:10,marginBottom:0}}>
          <div style={{flex:1}}><label style={s.lbl}>Meta ($)</label><input style={{...s.inp,marginBottom:12}} type="number" inputMode="decimal" placeholder="0.00" value={goalForm.target_amount} onChange={e=>setGoalForm(f=>({...f,target_amount:e.target.value}))}/></div>
          <div style={{flex:1}}><label style={s.lbl}>Ya tengo ($)</label><input style={{...s.inp,marginBottom:12}} type="number" inputMode="decimal" placeholder="0.00" value={goalForm.current_amount} onChange={e=>setGoalForm(f=>({...f,current_amount:e.target.value}))}/></div>
        </div>
        <label style={s.lbl}>Fecha objetivo (opcional)</label>
        <input style={{...s.inp,marginBottom:12}} type="date" value={goalForm.target_date} onChange={e=>setGoalForm(f=>({...f,target_date:e.target.value}))}/>
        <label style={s.lbl}>Notas (opcional)</label>
        <input style={{...s.inp,marginBottom:20}} placeholder="Ej: Para diciembre de este año" value={goalForm.notes} onChange={e=>setGoalForm(f=>({...f,notes:e.target.value}))}/>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>setMGoal(false)}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={saveNewGoal}>Crear meta</button>
        </div>
      </Modal>}

      {/* Modal: Editar meta */}
      {editGoal&&<Modal onClose={()=>setEditGoal(null)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Editar meta</div>
        <label style={s.lbl}>Nombre</label>
        <input autoFocus style={{...s.inp,marginBottom:12}} value={editGoal.name} onChange={e=>setEditGoal(f=>({...f,name:e.target.value}))}/>
        <label style={s.lbl}>Ícono</label>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>{GOAL_ICONS.map(ic=><button key={ic} onClick={()=>setEditGoal(f=>({...f,icon:ic}))} style={{fontSize:22,background:editGoal.icon===ic?C.accent+"33":"transparent",border:`2px solid ${editGoal.icon===ic?C.accent:C.border+"44"}`,borderRadius:10,padding:"5px 8px",cursor:"pointer"}}>{ic}</button>)}</div>
        <label style={s.lbl}>Color</label>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>{GOAL_COLORS.map(col=><button key={col} onClick={()=>setEditGoal(f=>({...f,color:col}))} style={{width:28,height:28,borderRadius:"50%",background:col,border:`3px solid ${editGoal.color===col?"#fff":col+"44"}`,cursor:"pointer"}}/>)}</div>
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1}}><label style={s.lbl}>Meta ($)</label><input style={{...s.inp,marginBottom:12}} type="number" inputMode="decimal" value={editGoal.target_amount} onChange={e=>setEditGoal(f=>({...f,target_amount:e.target.value}))}/></div>
          <div style={{flex:1}}><label style={s.lbl}>Ahorrado ($)</label><input style={{...s.inp,marginBottom:12}} type="number" inputMode="decimal" value={editGoal.current_amount} onChange={e=>setEditGoal(f=>({...f,current_amount:e.target.value}))}/></div>
        </div>
        <label style={s.lbl}>Fecha objetivo</label>
        <input style={{...s.inp,marginBottom:12}} type="date" value={editGoal.target_date||""} onChange={e=>setEditGoal(f=>({...f,target_date:e.target.value}))}/>
        <label style={s.lbl}>Notas</label>
        <input style={{...s.inp,marginBottom:20}} value={editGoal.notes||""} onChange={e=>setEditGoal(f=>({...f,notes:e.target.value}))}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>deleteGoal(editGoal.id)} style={{background:C.red+"22",color:C.red,border:`1px solid ${C.red}44`,borderRadius:12,padding:"12px 14px",fontSize:14,fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          <button style={{...s.btnO,flex:1}} onClick={()=>setEditGoal(null)}>Cancelar</button>
          <button style={{...s.btn(),flex:2}} onClick={saveEditGoal}>Guardar</button>
        </div>
      </Modal>}

      {/* Modal: Abonar a meta */}
      {mAddToGoal&&<Modal onClose={()=>{setMAddToGoal(null);setAddGoalAmt("");}}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:8}}>Abonar a meta</div>
        <div style={{fontSize:14,color:C.muted,marginBottom:16}}>{mAddToGoal.icon} {mAddToGoal.name} — Ahorrado: {fmt(mAddToGoal.current_amount)}</div>
        <label style={s.lbl}>¿Cuánto abonás?</label>
        <input autoFocus style={{...s.inp,marginBottom:20}} type="number" inputMode="decimal" placeholder="0.00" value={addGoalAmt} onChange={e=>setAddGoalAmt(e.target.value)}/>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>{setMAddToGoal(null);setAddGoalAmt("");}}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={addToGoal}>Abonar</button>
        </div>
      </Modal>}

      {/* Modal: Entrada manual */}
      {mMan&&<Modal onClose={()=>setMMan(false)}>
        <div style={{fontWeight:800,fontSize:18,marginBottom:16}}>Entrada manual</div>
        <label style={s.lbl}>Descripción</label>
        <input autoFocus style={{...s.inp,marginBottom:14}} placeholder="Ej: Supermercado Ley" value={man.desc} onChange={e=>setMan(f=>({...f,desc:e.target.value}))}/>
        <label style={s.lbl}>Monto</label>
        <input style={{...s.inp,marginBottom:14}} type="number" inputMode="decimal" placeholder="0.00" value={man.amt} onChange={e=>setMan(f=>({...f,amt:e.target.value}))}/>
        <label style={s.lbl}>Tipo</label>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {["gasto","ingreso"].map(t=>(
            <button key={t} onClick={()=>setMan(f=>({...f,type:t}))} style={{flex:1,padding:"11px",borderRadius:12,border:`2px solid ${man.type===t?(t==="gasto"?C.red:C.green):C.border+"44"}`,background:man.type===t?(t==="gasto"?C.red:C.green)+"22":"transparent",color:man.type===t?(t==="gasto"?C.red:C.green):C.muted,cursor:"pointer",fontWeight:700,fontSize:14}}>
              {t==="gasto"?"🔴 Gasto":"🟢 Ingreso"}
            </button>
          ))}
        </div>
        <label style={s.lbl}>Categoría</label>
        <select style={{...s.inp,marginBottom:14}} value={man.cat} onChange={e=>setMan(f=>({...f,cat:e.target.value}))}>
          {Object.entries(CATS).map(([k,v])=><option key={k} value={k}>{v.icon} {k}</option>)}
        </select>
        <label style={s.lbl}>Cuenta</label>
        <select style={{...s.inp,marginBottom:20}} value={man.aid} onChange={e=>setMan(f=>({...f,aid:e.target.value}))}>
          <option value="">Selecciona una cuenta</option>
          {accs.map(a=><option key={a.id} value={a.id}>{a.icon} {a.name}</option>)}
        </select>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.btnO,flex:1}} onClick={()=>setMMan(false)}>Cancelar</button>
          <button style={{...s.btn(),flex:1}} onClick={saveTxManual}>Guardar</button>
        </div>
      </Modal>}
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function Root(){
  const [session,setSession]=useState(null);
  const [checking,setChecking]=useState(true);
  useEffect(()=>{
    sbClient.auth.getSession().then(({data:{session}})=>{setSession(session);setChecking(false);});
    const{data:{subscription}}=sbClient.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>subscription.unsubscribe();
  },[]);
  const signOut=async()=>{await sbClient.auth.signOut();setSession(null);};
  if(checking)return(
    <div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0a0a0f",flexDirection:"column",gap:16}}>
      <div style={{fontSize:52}}>💰</div>
      <div style={{width:28,height:28,border:"3px solid #7c6af7",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
    </div>
  );
  if(!session)return <AuthScreen onAuth={setSession}/>;
  return <App session={session} onSignOut={signOut}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
